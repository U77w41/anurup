<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--seo-head-->
    <title>ANURUP | Free photo and PDF tools for online forms</title>
    <meta
      name="description"
      content="Resize photos to exact KB, make passport size photos, clean signatures, and merge, compress or unlock PDFs. Free, no sign-up, and files stay in your browser."
    />
    <!--/seo-head-->
    <meta name="author" content="Ujjwal Chowdhury" />
    <meta name="theme-color" content="#f5f5fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#303030" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved/system colour scheme before first paint (no light flash in dark mode).
      try {
        var t = localStorage.getItem("anurup-theme") || "system";
        var d = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", d);
        document.documentElement.style.colorScheme = d ? "dark" : "light";
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>

  <body>
    <div id="root"><!--seo-body--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
