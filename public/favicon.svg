<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <!-- <rect width="1000" height="1000" fill="#FFFFFF" /> -->
  <style>@media (prefers-color-scheme: dark) { g { stroke: #ffffff; } }</style>
  <g fill="none" stroke="#000000" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer top-right arm connecting to vertical stem -->
    <path d="M 280 200 
             H 740 
             A 60 60 0 0 1 800 260 
             V 640 
             A 60 60 0 0 1 740 700 
             H 650" />
    <!-- Continuous outer-left, bottom, vertical stem, and inner loop -->
    <path d="M 200 270 
             V 740 
             A 60 60 0 0 0 260 800 
             H 610 
             A 40 40 0 0 0 650 760 
             V 380 
             A 30 30 0 0 0 620 350 
             H 380 
             A 30 30 0 0 0 350 380 
             V 440 
             A 75 75 0 0 0 500 440 
             V 350" />
  </g>
</svg>